<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Food · Power BI Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2EA; --bg-grain:#E7ECE2; --surface:#FFFFFF;
    --ink:#13241B; --muted:#5E6E63; --faint:#8A9890; --line:#E0E6DC;
    --green:#1E7A46; --green-deep:#143C28; --green-soft:#E4F0E8;
    --lime:#A6CE39; --bigc-red:#E1251B;
    --c-sales:#1E7A46; --c-plm:#C28F1B; --c-npd:#E1251B;
    --c-project:#3565AE; --c-mini:#7E57C2; --c-renovate:#DC2626;
    --c-dsd:#EAB308; --c-purchase:#2563EB; --c-im:#7C3AED; --c-pricescrap:#EA7317;
    --radius:18px; --radius-sm:11px;
    --shadow:0 1px 2px rgba(20,60,40,.05), 0 14px 34px -18px rgba(20,60,40,.28);
    --shadow-hover:0 2px 4px rgba(20,60,40,.06), 0 26px 50px -20px rgba(20,60,40,.40);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(166,206,57,.16), transparent 60%),
      radial-gradient(900px 500px at -5% 0%, rgba(30,122,70,.10), transparent 55%),
      var(--bg);
    min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.45;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:26px 26px 60px}

  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:18px 24px;background:var(--green-deep);color:#fff;
    border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  header.top::after{content:"";position:absolute;inset:0;
    background:radial-gradient(420px 220px at 100% -40%, rgba(166,206,57,.35), transparent 60%);pointer-events:none}
  .brand{display:flex;align-items:center;gap:16px;z-index:1}
  .logo{width:42px;height:60px;border-radius:9px;background:transparent;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px -6px rgba(20,60,40,.45);flex:0 0 auto;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .titles h1{font-family:"Bricolage Grotesque";font-size:25px;font-weight:800;letter-spacing:-.4px;line-height:1.05}
  .titles h1 em{font-style:normal;color:var(--lime)}
  .titles p{font-family:"IBM Plex Mono";font-size:11.5px;letter-spacing:1.5px;color:#A9C4B4;margin-top:4px;text-transform:uppercase}
  .clock{text-align:right;z-index:1}
  .clock .date{font-family:"Bricolage Grotesque";font-size:16px;font-weight:600}
  .clock .time{font-family:"IBM Plex Mono";font-size:12px;color:#9DBBAB;margin-top:3px;letter-spacing:1px}
  .clock .refresh{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.5px;color:#cfe6d8;
    background:rgba(166,206,57,.16);border:1px solid rgba(166,206,57,.35);padding:3px 9px;border-radius:999px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(166,206,57,.6)}70%{box-shadow:0 0 0 7px rgba(166,206,57,0)}100%{box-shadow:0 0 0 0 rgba(166,206,57,0)}}

  .grid-shell{display:grid;grid-template-columns:228px 1fr;gap:22px;margin-top:22px;align-items:start}
  aside{position:sticky;top:22px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow)}
  .nav-head{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:2px;color:var(--faint);
    text-transform:uppercase;padding:2px 8px 12px}
  .navlist{display:flex;flex-direction:column;gap:6px}
  .navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;
    border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;
    font-family:"Inter";font-size:13.5px;font-weight:600;color:var(--muted);transition:.18s ease}
  .navbtn .swatch{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .navbtn .count{margin-left:auto;font-family:"IBM Plex Mono";font-size:11px;color:var(--faint)}
  .navbtn:hover{background:var(--bg-grain);color:var(--ink)}
  .navbtn.active{background:var(--green-soft);border-color:#C6E2D0;color:var(--green-deep)}
  .navbtn.empty{opacity:.5}
  .aside-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .aside-foot a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);
    font-size:12.5px;font-weight:500;padding:6px 8px;border-radius:9px}
  .aside-foot a:hover{background:var(--bg-grain);color:var(--ink)}

  .content-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .content-head h2{font-family:"Bricolage Grotesque";font-size:20px;font-weight:700;letter-spacing:-.3px}
  .content-head h2 span{color:var(--faint);font-weight:500}
  .legend{display:flex;gap:14px;align-items:center;font-family:"IBM Plex Mono";font-size:10.5px;color:var(--muted);letter-spacing:.3px}
  .legend i{display:inline-flex;align-items:center;gap:5px;font-style:normal}
  .legend .pip{width:7px;height:7px;border-radius:50%}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);transition:transform .2s ease, box-shadow .2s ease;
    display:flex;flex-direction:column;--accent:var(--c-sales)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .card-body{padding:18px 18px 0 22px;display:flex;flex-direction:column;gap:12px;flex:1}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .card-cat{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:1px;text-transform:uppercase;
    color:var(--accent);font-weight:600;background:color-mix(in srgb, var(--accent) 12%, white);
    padding:3px 8px;border-radius:999px;border:1px solid color-mix(in srgb, var(--accent) 24%, white)}
  .status{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono";font-size:10.5px;color:var(--muted);white-space:nowrap}
  .status .pip{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .status.stale .pip{background:#E0A800}
  .card-title{font-family:"Bricolage Grotesque";font-size:16.5px;font-weight:700;line-height:1.2;letter-spacing:-.2px}
  .card-title em{font-style:italic;color:var(--green);font-weight:600}
  .card-sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:-6px;letter-spacing:.2px}
  .thumb{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#FBFCFA;margin-top:2px}
  .thumb svg,.thumb img{display:block;width:100%;height:auto}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 16px 22px;margin-top:auto}
  .open-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;
    font-family:"Inter";font-size:13.5px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 75%,white));
    padding:9px 16px;border-radius:11px;border:none;
    box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 92%,transparent);transition:.18s ease}
  .open-btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
  .open-btn svg{width:14px;height:14px}
  .meta{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--faint);text-align:right;line-height:1.5}
  .card[data-cat="dsd"] .open-btn{color:#3f2d00}
  .card[data-cat="dsd"] .card-cat{color:#8a6400}

  .card.soon{--accent:var(--c-project)}
  .card.soon::before{background:repeating-linear-gradient(180deg,var(--accent),var(--accent) 8px,transparent 8px,transparent 16px);opacity:.4}
  .soon-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 22px;gap:12px;min-height:260px}
  .soon-ico{width:46px;height:46px;border-radius:13px;background:var(--bg-grain);display:flex;align-items:center;justify-content:center;font-size:22px}
  .soon-body h3{font-family:"Bricolage Grotesque";font-size:16.5px;font-weight:700}
  .soon-body p{font-size:12px;color:var(--muted);max-width:200px}
  .soon-tag{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);border:1px dashed var(--line);padding:4px 10px;border-radius:999px}
  .ghost-btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:"Inter";font-size:12.5px;font-weight:600;
    color:var(--green-deep);background:transparent;border:1px solid #C6E2D0;padding:8px 14px;border-radius:10px;transition:.18s}
  .ghost-btn:hover{background:var(--green-soft)}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--green-deep);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow-hover);opacity:0;pointer-events:none;transition:.25s ease;z-index:50;display:flex;align-items:center;gap:9px}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .dot{background:var(--lime)}
  footer.foot{margin-top:34px;text-align:center;font-family:"IBM Plex Mono";font-size:11px;color:var(--faint);letter-spacing:.5px}

  @media (max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:820px){
    .grid-shell{grid-template-columns:1fr}
    aside{position:static}.navlist{flex-direction:row;flex-wrap:wrap}
    .navbtn{width:auto}.navbtn .count{display:none}.aside-foot{display:none}
  }
  @media (max-width:560px){
    .wrap{padding:16px 14px 48px}
    header.top{flex-direction:column;align-items:flex-start;gap:16px}
    .clock{text-align:left}.cards{grid-template-columns:1fr}.titles h1{font-size:21px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  :focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
</style>
</head>

const palette={g:'#1E7A46',gl:'#A6CE39',soft:'#E4F0E8',line:'#E0E6DC',ink:'#13241B',mut:'#9AA89F'};
function spark(x,y,w,h,seed){let pts=[],n=22;for(let i=0;i<n;i++){let v=Math.sin(i*0.55+seed)*0.5+Math.sin(i*1.7+seed*2)*0.28+(i>14?0.5:0);pts.push([x+i/(n-1)*w,y+h-((v+1.1)/2.4)*h]);}let d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');let area=d+` L${(x+w).toFixed(1)} ${(y+h).toFixed(1)} L${x.toFixed(1)} ${(y+h).toFixed(1)} Z`;return `<path d="${area}" fill="${palette.soft}"/><path d="${d}" fill="none" stroke="${palette.g}" stroke-width="2" stroke-linecap="round"/>`;}
function kpi(x,y,w,label,big){return `<rect x="${x}" y="${y}" width="${w}" height="34" rx="6" fill="#FBFCFA" stroke="${palette.line}"/><text x="${x+8}" y="${y+13}" font-family="IBM Plex Mono" font-size="6" fill="${palette.mut}">${label}</text><text x="${x+8}" y="${y+27}" font-family="Bricolage Grotesque" font-weight="700" font-size="12" fill="${palette.ink}">${big}</text>`;}
function bar(x,y,w,h){let s='';const n=9;for(let i=0;i<n;i++){let bh=8+((i*37)%26);s+=`<rect x="${(x+i*(w/n)).toFixed(1)}" y="${(y+h-bh).toFixed(1)}" width="${(w/n*0.62).toFixed(1)}" height="${bh}" rx="2" fill="${i===n-1?palette.gl:palette.g}"/>`;}return s;}

}
function crate(x,y,s,fill){

function shelfRow(x,y,count,fill){

const CATLABEL=CAT_LABELS;
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function thumbHtml(t){if(!t) return THUMBS.A; if(t.startsWith('img:')) return `<img src="${esc(t.slice(4))}" alt="">`; return THUMBS[t]||THUMBS.A;}

function cardHtml(r){
  const accent=`var(--c-${r.cat})`;
  if(r.status==='soon'){
    return `<article class="card soon" data-cat="${r.cat}" style="--accent:${accent}">
      <div class="soon-body">
        <div class="soon-ico">${r.icon||'📊'}</div>
        <h3>${esc(r.name)}</h3>
        <p>${esc(r.desc||'')}</p>
        <span class="soon-tag">Coming soon</span>
        <button class="ghost-btn" data-report="${esc(r.name)}">＋ Notify me when live</button>
      </div></article>`;
  }
  const fmt = r.format ? ` <em>${esc(r.format)}</em>` : '';
  const isReal = /^https?:\/\//i.test(r.link||'');
  const ext = isReal ? ' target="_blank" rel="noopener"' : '';
  return `<article class="card" data-cat="${r.cat}" style="--accent:${accent}">
    <div class="card-body">
      <div class="card-top">
        <span class="card-cat">${esc(CATLABEL[r.cat]||r.cat)}</span>
      </div>
      <div class="card-title">${esc(r.name)}${fmt}</div>
      <div class="card-sub">${esc(r.sub||'')}</div>
      <div class="thumb">${thumbHtml(r.thumb)}</div>
    </div>
    <div class="card-foot">
      <a class="open-btn" data-report="${esc(r.name)}" href="${esc(r.link||'#')}"${ext}>${esc(r.btn||'Open report')} ${ARROW}</a>
    </div></article>`;
}

function render(){
  document.getElementById('cards').innerHTML = REPORTS.map(cardHtml).join('');
  const counts={all:REPORTS.length};
  REPORTS.forEach(r=>counts[r.cat]=(counts[r.cat]||0)+1);
  document.getElementById('nav').innerHTML = CATS.map((c,i)=>{
    const n=counts[c.key]||0;
    const sw = c.key==='all' ? 'background:linear-gradient(135deg,var(--green),var(--lime))' : `background:var(--c-${c.key})`;
    return `<button class="navbtn${i===0?' active':''}${n===0&&c.key!=='all'?' empty':''}" data-cat="${c.key}">
      <span class="swatch" style="${sw}"></span>${c.label}<span class="count">${n}</span></button>`;
  }).join('');
}
render();

/* ----- date / time ----- */
function fmt(){const now=new Date();
  document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('time').textContent=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' ICT';}
fmt();setInterval(fmt,1000);

/* ----- toast ----- */
function toast(msg){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

/* ----- filter ----- */
document.getElementById('nav').addEventListener('click',e=>{
  const btn=e.target.closest('.navbtn');if(!btn)return;
  document.querySelectorAll('#nav .navbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cat=btn.dataset.cat;
  document.getElementById('shown').textContent = cat==='all'?'· all':'· '+CATLABEL[cat];
  document.querySelectorAll('#cards .card').forEach(c=>{c.style.display=(cat==='all'||c.dataset.cat===cat)?'':'none';});
});

/* ----- buttons (mockup). ใช้ลิงก์จริง: ลบ 2 บรรทัด preventDefault ด้านล่าง ----- */
document.addEventListener('click',e=>{
  const open=e.target.closest('.open-btn');
  if(open){
    const href=open.getAttribute('href')||'#';
    if(!/^https?:\/\//i.test(href)){ e.preventDefault(); toast('Opening "'+open.dataset.report+'" in Power BI…'); }
    /* real http(s) link → browser opens it in a new tab, no mock toast */
  }
  const ghost=e.target.closest('.ghost-btn');
  if(ghost){e.preventDefault();toast('We\'ll notify you when "'+ghost.dataset.report+'" is live.');}
});
</script>
